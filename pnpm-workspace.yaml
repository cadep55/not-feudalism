packages:
  - apps/*
  - packages/*

# Pin exact versions when adding dependencies (AGENTS.md: no casual upgrades)
savePrefix: ""

# Dependency install scripts are blocked unless listed here.
# - lefthook: its postinstall is skipped; the root "prepare" script installs the hooks.
# - esbuild: its postinstall only re-checks the platform binary, which pnpm already
#   installs as an optional dependency.
allowBuilds:
  esbuild: false
  lefthook: false
