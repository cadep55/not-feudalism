# Git hooks, installed by `pnpm install` (the root "prepare" script).
pre-commit:
  commands:
    biome:
      glob: "*.{js,mjs,cjs,ts,mts,tsx,json,jsonc,css}"
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true

pre-push:
  commands:
    check:
      run: pnpm check
