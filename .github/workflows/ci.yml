name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Cache Turborepo
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Lint and format
        run: pnpm exec biome ci .

      - name: Typecheck, test and build
        run: pnpm exec turbo run typecheck test build --cache-dir=.turbo/cache

  integration:
    name: Integration tests (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nf
          POSTGRES_PASSWORD: nf_ci_password
          POSTGRES_DB: not_feudalism
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nf -d not_feudalism"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgres://nf:nf_ci_password@localhost:5432/not_feudalism
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm db:migrate

      - name: Seed the database
        run: pnpm db:seed

      - name: Run integration tests
        run: pnpm test:integration

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nf
          POSTGRES_PASSWORD: nf_ci_password
          POSTGRES_DB: not_feudalism
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nf -d not_feudalism"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgres://nf:nf_ci_password@localhost:5432/not_feudalism
      NODE_ENV: test
      PORT: "2567"
      # Playwright serves the production client build with `vite preview` on 4173.
      CLIENT_ORIGIN: http://localhost:4173
      VITE_SERVER_URL: http://localhost:2567
      # Every test signs up a fresh player; don't let the per-IP limit get in the way.
      AUTH_RATE_LIMIT: "1000"
      LOG_LEVEL: warn
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm --filter @nf/e2e exec playwright install --with-deps chromium

      - name: Apply database migrations
        run: pnpm db:migrate

      - name: Build the client
        run: pnpm --filter @nf/client build

      - name: Run end-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
