name: Feature
description: A new game feature or player-facing change
labels: ["type:feature"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should players be able to do, and why does it matter?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: A checklist that proves it's done.
      value: |
        - [ ]
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [economy, combat, land, social, client, server, shared, db, infra]
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: Design notes
      description: Numbers, rules, mock-ups, open questions.
